name: Build Multi-OS Executables

# Déclencheurs :
# - publication d'une release depuis la page Releases de GitHub. Contrairement
#   à « push: tags », l'événement est émis même quand la release reprend un tag
#   qui existait déjà. Une release enregistrée en brouillon (« Save draft »)
#   ne crée pas son tag et ne déclenche rien : il faut « Publish release ».
#   GitHub lit ce fichier dans le commit du tag : un tag posé sur un commit
#   antérieur à ce déclencheur ne lance donc rien (utiliser le lancement manuel).
# - lancement manuel depuis l'onglet Actions (« Run workflow »), pour
#   (re)compiler la release d'un tag existant.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à compiler (par exemple v1.0.5)'
        required: true
        type: string

permissions:
  contents: write

# Tag à compiler : celui de la release publiée, ou celui saisi à la main.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # ====================================================================
  # Numéro de version : calculé une seule fois d'après le tag, puis
  # reporté dans le version.txt de la branche principale du dépôt.
  # ====================================================================
  version:
    name: Update version.txt
    runs-on: ubuntu-latest
    outputs:
      tuple: ${{ steps.parse.outputs.tuple }}
      dotted: ${{ steps.parse.outputs.dotted }}

    steps:
    # Tag → numéro à quatre chiffres (v1.2.3 → 1.2.3.0, v1.2.3.4 → 1.2.3.4).
    # Un tag d'une autre forme (v2.0-beta…) arrête tout le workflow, plutôt
    # que de produire des exécutables avec un numéro faux.
    - name: Parse tag
      id: parse
      run: |
        tag="${RELEASE_TAG#v}"
        if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
          echo "::error::❌ Tag « $RELEASE_TAG » invalide : format attendu v1.2.3 ou v1.2.3.4"
          exit 1
        fi
        major="${BASH_REMATCH[1]}"
        minor="${BASH_REMATCH[2]}"
        patch="${BASH_REMATCH[3]}"
        build="${BASH_REMATCH[5]:-0}"
        echo "tuple=($major, $minor, $patch, $build)" >> "$GITHUB_OUTPUT"
        echo "dotted=$major.$minor.$patch.$build" >> "$GITHUB_OUTPUT"
        echo "✅ Version $major.$minor.$patch.$build"
      shell: bash

    # La branche principale (et non le tag) : c'est elle qu'on met à jour.
    - name: Checkout default branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}

    # Commit de version.txt sur la branche principale, seulement si le
    # numéro du tag est plus récent que celui du fichier : la recompilation
    # manuelle d'un ancien tag ne doit pas faire reculer la version.
    # Un échec (branche protégée…) n'empêche pas la compilation : il est
    # signalé par un avertissement dans le résumé du workflow.
    # Le push fait avec GITHUB_TOKEN ne déclenche aucun autre workflow.
    - name: Commit version.txt
      continue-on-error: true
      env:
        TUPLE: ${{ steps.parse.outputs.tuple }}
        DOTTED: ${{ steps.parse.outputs.dotted }}
      run: |
        current="$(grep -oP "StringStruct\('FileVersion', '\K[0-9.]+" version.txt)"
        newest="$(printf '%s\n%s\n' "$current" "$DOTTED" | sort -V | tail -n 1)"
        if [ "$current" = "$DOTTED" ]; then
          echo "✅ version.txt est déjà en $DOTTED"
          exit 0
        fi
        if [ "$newest" != "$DOTTED" ]; then
          echo "⚠️ version.txt ($current) est plus récent que le tag ($DOTTED) : inchangé"
          exit 0
        fi
        sed -E -i \
          -e "s/(filevers|prodvers)=\([0-9, ]+\)/\1=$TUPLE/" \
          -e "s/(StringStruct\('(FileVersion|ProductVersion)', ')[0-9.]+'/\1$DOTTED'/" \
          version.txt
        if [ "$(grep -cF "$TUPLE" version.txt)" -ne 2 ] || [ "$(grep -cF "'$DOTTED'" version.txt)" -ne 2 ]; then
          echo "::warning::❌ version.txt n'a pas pu être mis à jour en $DOTTED"
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add version.txt
        git commit --message "Version $DOTTED dans version.txt (release $RELEASE_TAG)."
        if ! git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
          echo "::warning::❌ Impossible de pousser version.txt (branche protégée ?)"
          exit 1
        fi
        echo "✅ version.txt mis à jour en $DOTTED ($current auparavant) et poussé"
      shell: bash

  # ====================================================================
  # Compilation sur les trois systèmes, en x86_64 et en ARM64
  # ====================================================================
  # PyInstaller ne compile pas pour une autre architecture : chaque
  # architecture a donc son propre runner. Les runners ARM de Linux et
  # de Windows sont disponibles dans les dépôts privés depuis janvier 2026 ;
  # macos-latest tourne déjà sur Apple Silicon (ARM64).
  # Windows ARM64 est « expérimental » : toutes les dépendances (OpenCV
  # notamment) n'y ont pas forcément de paquet précompilé. Son échec
  # n'empêche pas la publication des autres archives.
  # ====================================================================
  build:
    name: Build on ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Un système en échec n'annule pas la compilation des autres.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: ubuntu-24.04-arm
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: false
          - os: windows-11-arm
            experimental: true

    steps:
    # Récupère le code du tag (en lancement manuel, github.ref désigne la
    # branche choisie dans l'onglet Actions, pas le tag).
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # ------------------------------------------------------------------
    # requirements.txt installe « onnxruntime » partout. Sous Windows x86_64
    # (seule plateforme où PyPI publie DirectML), on le remplace ici :
    # les deux paquets écrivent dans le même dossier « onnxruntime », il faut
    # donc retirer l'un avant d'installer l'autre (ses dépendances sont déjà
    # présentes, d'où --no-deps). Le choix se fait par runner.arch et non
    # par un marqueur « platform_machine » dans requirements.txt : sur
    # windows-11-arm, ce marqueur valait AMD64 alors que Python est ARM64.
    # Les métadonnées de « onnxruntime » disparaissent : le hook
    # hooks/hook-deepface.py en tient compte.
    # ------------------------------------------------------------------
    - name: Keep only onnxruntime-directml (Windows x86_64)
      if: runner.os == 'Windows' && runner.arch == 'X64'
      run: |
        pip uninstall --yes onnxruntime onnxruntime-directml
        pip install --no-deps onnxruntime-directml
        python -c "import onnxruntime; providers = onnxruntime.get_available_providers(); print(providers); assert 'DmlExecutionProvider' in providers"
      shell: bash

    # ------------------------------------------------------------------
    # Le commit du tag est antérieur au commit de version.txt fait par le
    # job « version » : on réécrit donc aussi la copie de travail du runner,
    # avec le numéro calculé par ce job, pour que l'exécutable le porte.
    # ------------------------------------------------------------------
    - name: Update version.txt from tag (Windows)
      if: runner.os == 'Windows'
      env:
        TUPLE: ${{ needs.version.outputs.tuple }}
        DOTTED: ${{ needs.version.outputs.dotted }}
      run: |
        # filevers / prodvers (tuples) et FileVersion / ProductVersion (texte)
        sed -E -i \
          -e "s/(filevers|prodvers)=\([0-9, ]+\)/\1=$TUPLE/" \
          -e "s/(StringStruct\('(FileVersion|ProductVersion)', ')[0-9.]+'/\1$DOTTED'/" \
          version.txt
        # Contrôle : les quatre champs doivent avoir été remplacés
        if [ "$(grep -cF "$TUPLE" version.txt)" -ne 2 ] || [ "$(grep -cF "'$DOTTED'" version.txt)" -ne 2 ]; then
          echo "❌ version.txt n'a pas pu être mis à jour en $DOTTED"
          exit 1
        fi
        echo "✅ version.txt mis à jour en $DOTTED"
      shell: bash

    # ------------------------------------------------------------------
    # Option commune, pour DeepFace : --additional-hooks-dir hooks charge
    # hooks/hook-deepface.py, qui ajoute les modules que DeepFace importe
    # par leur nom (importlib) et les métadonnées de ses dépendances (gdown
    # lit les siennes). Il remplace --collect-submodules et
    # --recursive-copy-metadata deepface : ce dernier échouait sous Windows
    # x86_64, où « onnxruntime » est remplacé par « onnxruntime-directml ».
    # ------------------------------------------------------------------
    # Compilation sous Windows (séparateur ';' et support de --version-file)
    # ------------------------------------------------------------------
    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --noconsole \
          --icon=face_tagger.ico \
          --version-file=version.txt \
          --add-data "face_tagger.ico;." \
          --additional-hooks-dir hooks \
          face_tagger.py
      shell: bash

    # ------------------------------------------------------------------
    # Compilation sous Linux / macOS (séparateur ':')
    # Note : --version-file est ignoré sur non-Windows (spécifique aux ressources PE)
    # ------------------------------------------------------------------
    - name: Build Executable (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile \
          --icon=face_tagger.ico \
          --add-data "face_tagger.ico:." \
          --additional-hooks-dir hooks \
          face_tagger.py
      shell: bash

    # ------------------------------------------------------------------
    # Archive de l'exécutable, nommée d'après le tag, le système et
    # l'architecture (face_tagger-v1.2.3-linux-x86_64.tar.gz…) : sous
    # Linux et macOS, PyInstaller produit le même nom (dist/face_tagger),
    # et le dernier envoyé écrasait l'autre dans la Release.
    # tar.gz pour Linux / macOS (conserve le droit d'exécution), zip
    # pour Windows (ouvert nativement par l'Explorateur).
    # ------------------------------------------------------------------
    - name: Package executable
      env:
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        case "$RUNNER_OS_NAME" in
          Linux) os="linux" ;;
          macOS) os="macos" ;;
          Windows) os="windows" ;;
          *) echo "❌ Système inconnu : $RUNNER_OS_NAME"; exit 1 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch="x86_64" ;;
          ARM64) arch="arm64" ;;
          X86) arch="x86" ;;
          *) echo "❌ Architecture inconnue : $RUNNER_ARCH_NAME"; exit 1 ;;
        esac
        archive="face_tagger-$RELEASE_TAG-$os-$arch"
        mkdir release
        if [ "$os" = "windows" ]; then
          7z a -tzip "release/$archive.zip" ./dist/face_tagger.exe
        else
          tar --create --gzip --file "release/$archive.tar.gz" --directory dist face_tagger
        fi
        ls -l release
        echo "✅ Archive release/$archive créée"
      shell: bash

    - name: Upload archives to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: release/*
        tag: ${{ env.RELEASE_TAG }}
        overwrite: true
        file_glob: true
