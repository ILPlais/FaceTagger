name: Build Multi-OS Executables

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # ------------------------------------------------------------------
    # Compilation sous Windows (séparateur ';' et support de --version-file)
    # ------------------------------------------------------------------
    - name: Build Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --noconsole \
          --icon=face_tagger.ico \
          --version-file=version.txt \
          --add-data "face_tagger.ico;." \
          face_tagger.py
      shell: bash

    # ------------------------------------------------------------------
    # Compilation sous Linux / macOS (séparateur ':')
    # Note : --version-file est ignoré sur non-Windows (spécifique aux ressources PE)
    # ------------------------------------------------------------------
    - name: Build Executable (Linux / macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile \
          --icon=face_tagger.ico \
          --add-data "face_tagger.ico:." \
          face_tagger.py
      shell: bash

    - name: Upload binaries to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: dist/*
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true