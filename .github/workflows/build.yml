name: Build Multi-OS Executables

# Déclencheurs :
# - publication d'une release depuis la page Releases de GitHub. Contrairement
#   à « push: tags », l'événement est émis même quand la release reprend un tag
#   qui existait déjà. Une release enregistrée en brouillon (« Save draft »)
#   ne crée pas son tag et ne déclenche rien : il faut « Publish release ».
#   GitHub lit ce fichier dans le commit du tag : un tag posé sur un commit
#   antérieur à ce déclencheur ne lance donc rien (utiliser le lancement manuel).
# - lancement manuel depuis l'onglet Actions (« Run workflow »), pour
#   (re)compiler la release d'un tag existant.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release à compiler (par exemple v1.0.5)'
        required: true
        type: string

permissions:
  contents: write

# Tag à compiler : celui de la release publiée, ou celui saisi à la main.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # Récupère le code du tag (en lancement manuel, github.ref désigne la
    # branche choisie dans l'onglet Actions, pas le tag).
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash

    # ------------------------------------------------------------------
    # Compilation sous Windows (séparateur ';' et support de --version-file)
    # ------------------------------------------------------------------
    - name: Build Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --onefile --noconsole \
          --icon=face_tagger.ico \
          --version-file=version.txt \
          --add-data "face_tagger.ico;." \
          face_tagger.py
      shell: bash

    # ------------------------------------------------------------------
    # Compilation sous Linux / macOS (séparateur ':')
    # Note : --version-file est ignoré sur non-Windows (spécifique aux ressources PE)
    # ------------------------------------------------------------------
    - name: Build Executable (Linux / macOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --onefile \
          --icon=face_tagger.ico \
          --add-data "face_tagger.ico:." \
          face_tagger.py
      shell: bash

    - name: Upload binaries to Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: dist/*
        tag: ${{ env.RELEASE_TAG }}
        overwrite: true
        file_glob: true
