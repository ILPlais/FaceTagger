<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
	Icône de Face Tagger (512 × 512).
	Idée : un groupe de personnes, dont le visage central est repéré par un cadre de détection,
	et une étiquette de nom qui s'y accroche (détection → regroupement → nom).
-->

<svg
   viewBox="0 0 512 512"
   width="512"
   height="512"
   role="img"
   aria-labelledby="title desc"
   version="1.1"
   id="svg12"
   sodipodi:docname="face_tagger.svg"
   inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)"
   inkscape:export-filename="face_tagger.png"
   inkscape:export-xdpi="96"
   inkscape:export-ydpi="96"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:c2pa="http://c2pa.org/manifest">
  <sodipodi:namedview
     id="namedview12"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="true"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.5097656"
     inkscape:cx="255.66882"
     inkscape:cy="256"
     inkscape:window-width="1920"
     inkscape:window-height="991"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg12" />
  <metadata
     id="metadata1">
    <c2pa:manifest></c2pa:manifest>
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Face Tagger</dc:title>
        <dc:creator>
          <cc:Agent>
            <dc:title>Lionel PLAIS</dc:title>
          </cc:Agent>
        </dc:creator>
        <cc:license
           rdf:resource="https://www.opensource.org/licenses/MIT" />
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <title
     id="title">Face Tagger</title>
  <desc
     id="desc">Trois silhouettes de personnes dans un cadre de détection de visage, avec une étiquette de nom.</desc>
  <defs
     id="defs4">
    <!-- Fond : dégradé bleu → violet -->
    <linearGradient
       id="background"
       x1="0"
       y1="0"
       x2="512"
       y2="512"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#3b82f6"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#6d28d9"
         id="stop2" />
    </linearGradient>
    <!-- Léger reflet en haut à gauche pour donner du volume -->
    <radialGradient
       id="shine"
       cx="130"
       cy="90"
       r="380"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffffff"
         stop-opacity="0.28"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#ffffff"
         stop-opacity="0"
         id="stop4" />
    </radialGradient>
  </defs>
  <!-- Pastille de l'application : carré aux coins arrondis -->
  <rect
     width="512"
     height="512"
     rx="112"
     fill="url(#background)"
     id="rect4" />
  <rect
     width="512"
     height="512"
     rx="112"
     fill="url(#shine)"
     id="rect5" />
  <!-- Personnes à l'arrière-plan (gauche et droite), semi-transparentes : le « groupe » -->
  <g
     fill="#ffffff"
     fill-opacity="0.55"
     id="g6">
    <circle
       cx="170"
       cy="244"
       r="36"
       id="circle5" />
    <path
       d="M112 364 C112 322 138 304 170 304 C202 304 228 322 228 364 Z"
       id="path5" />
    <circle
       cx="342"
       cy="244"
       r="36"
       id="circle6" />
    <path
       d="M284 364 C284 322 310 304 342 304 C374 304 400 322 400 364 Z"
       id="path6" />
  </g>
  <!-- Personne au premier plan (visage central) -->
  <g
     fill="#ffffff"
     id="g7">
    <circle
       cx="256"
       cy="212"
       r="58"
       id="circle7" />
    <path
       d="M148 364 C148 300 196 276 256 276 C316 276 364 300 364 364 Z"
       id="path7" />
  </g>
  <!-- Cadre de détection : quatre coins, en ambre pour bien ressortir -->
  <g
     fill="none"
     stroke="#fcd34d"
     stroke-width="20"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="g11">
    <path
       d="M104 170 V128 Q104 104 128 104 H170"
       id="path8" />
    <path
       d="M342 104 H384 Q408 104 408 128 V170"
       id="path9" />
    <path
       d="M104 342 V384 Q104 408 128 408 H170"
       id="path10" />
    <path
       d="M342 408 H384 Q408 408 408 384 V342"
       id="path11" />
  </g>
  <!-- Étiquette de nom : pastille blanche avec un trou d'attache et une ligne de texte -->
  <rect
     x="186"
     y="380"
     width="140"
     height="48"
     rx="24"
     fill="#ffffff"
     id="rect11" />
  <circle
     cx="214"
     cy="404"
     r="8"
     fill="#4f46e5"
     id="circle11" />
  <rect
     x="236"
     y="396"
     width="68"
     height="16"
     rx="8"
     fill="#4f46e5"
     id="rect12" />
</svg>
